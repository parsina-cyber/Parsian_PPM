# Initial HTTP virtual host. Enable HTTPS with Certbot after checking DNS,
# existing virtual hosts, and the administrator account or imported database.
# Keep the existing parsian-ppm.com configuration in place.
server {
    listen 80;
    server_name crm.parsian-ppm.com;

    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
